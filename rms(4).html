<!DOCTYPE html>
<html>
<head>
    <title>Amararaja EV RMS</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <style>
        :root {
            --bg-color: #f3f6fb;
            --header-bg: #0a2540;
            --card-bg: white;
            --text-color: #333;
            --panel-shadow: rgba(0,0,0,0.1);
        }

        [data-theme="dark"] {
            --bg-color: #1a1a2e;
            --header-bg: #0f0f1b;
            --card-bg: #16213e;
            --text-color: #e9ecef;
            --panel-shadow: rgba(0,0,0,0.5);
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            transition: 0.3s;
            overflow-x: hidden;
        }

        header {
            background: var(--header-bg);
            color: white;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .container { padding: 20px; }

        .cards { display: flex; gap: 15px; margin-bottom: 20px; }
        .card {
            flex: 1;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 4px var(--panel-shadow);
            text-align: center;
        }

        .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        
        .panel {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            height: 450px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            box-shadow: 0 2px 4px var(--panel-shadow);
        }

        .chart-wrapper {
            flex: 1;
            position: relative;
            min-height: 0; 
            width: 100%;
        }

        #map { flex: 1; width: 100%; border-radius: 8px; border: 1px solid #ddd; }

        .chargerPanel {
            position: fixed;
            right: 0;
            top: 0;
            width: 300px;
            height: 100%;
            background: var(--card-bg);
            box-shadow: -5px 0 15px rgba(0,0,0,0.2);
            padding: 25px;
            display: none;
            z-index: 1000;
        }

        button {
            padding: 10px;
            margin-top: 10px;
            cursor: pointer;
            border-radius: 4px;
            border: none;
            width: 100%;
            background: #007bff;
            color: white;
            font-weight: bold;
        }

        button:disabled { background: #ccc; cursor: not-allowed; }

        #customModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .modal-content {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            min-width: 250px;
        }

        .theme-toggle { background: #4caf50; width: auto; padding: 5px 15px; }
    </style>
</head>

<body>

<div id="login" style="height:100vh; display:flex; align-items:center; justify-content:center; background:#0a2540;">
    <div style="background:white; padding:40px; border-radius:8px; width: 300px;">
        <h3 style="color: #0a2540; text-align: center;">RMS Login</h3>
        <input id="user" placeholder="Username (admin/operator)" style="display:block; margin-bottom:10px; padding:10px; width:100%; box-sizing: border-box;">
        <input id="pass" type="password" placeholder="Password" style="display:block; margin-bottom:10px; padding:10px; width:100%; box-sizing: border-box;">
        <button onclick="login()">Login</button>
    </div>
</div>

<div id="dash" style="display:none;">
    <header>
        <div style="font-weight: bold; font-size: 1.2rem;">Amararaja EV RMS</div>
        <div style="display:flex; align-items:center; gap:20px;">
            <span id="roleDisplay"></span>
            <button class="theme-toggle" onclick="toggleTheme()">Toggle Theme 🌓</button>
        </div>
    </header>

    <div class="container">
        <div class="cards">
            <div class="card">Total <h2 id="total">0</h2></div>
            <div class="card">Online <h2 id="online" style="color:#4caf50">0</h2></div>
            <div class="card">Busy <h2 id="busy" style="color:#ff9800">0</h2></div>
            <div class="card">Offline <h2 id="offline" style="color:#f44336">0</h2></div>
            <div class="card">Fault <h2 id="fault" style="color:#9c27b0">0</h2></div>
        </div>

        <div class="grid">
            <div class="panel">
                <h3>Charger Map</h3>
                <div id="map"></div>
            </div>
            <div class="panel">
                <h3>Station Analytics (Real-time)</h3>
                <div class="chart-wrapper">
                    <canvas id="chart"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="chargerPanel" id="cpanel">
    <button onclick="closePanel()" style="background:#dc3545; width:40px; float:right; margin-top: 0;">×</button>
    <h3 id="cname">Charger ID</h3>
    <p>Status: <b id="cstatus"></b></p>
    <hr>
    <h4>Gun Monitoring</h4>
    Gun 1 Power: <span id="g1">0</span> kW<br>
    Gun 2 Power: <span id="g2">0</span> kW
    <hr>
    <h4>Commands</h4>
    <button id="restartBtn" onclick="runCommand('Restart')">Restart</button>
    <button id="firmwareBtn" onclick="runCommand('Firmware Update')">Firmware Update</button>
    <button onclick="runCommand('Report Generation')" style="background:#28a745;">Generate Report</button>
</div>

<div id="customModal">
    <div class="modal-content">
        <div style="font-size: 3rem; color: #4caf50;">✔</div>
        <h2 style="color:#4caf50; margin-top: 0;">Done!</h2>
        <p id="modalMsg"></p>
        <button onclick="closeModal()" style="background:#0a2540;">OK</button>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
let role = "operator";
let chart;
let map;
let selected = null;
let theme = "light";

// Data with 5 Chargers
let chargers = [
    {id:"EV-AMR-01", lat:13.08, lng:80.27, status:"online", fault:false, gun1:0, gun2:0},
    {id:"EV-AMR-02", lat:12.97, lng:77.59, status:"offline", fault:false, gun1:0, gun2:0},
    {id:"EV-AMR-03", lat:17.38, lng:78.48, status:"busy", fault:false, gun1:0, gun2:0},
    {id:"EV-AMR-04", lat:19.07, lng:72.87, status:"online", fault:false, gun1:0, gun2:0},
    {id:"EV-AMR-05", lat:28.61, lng:77.20, status:"online", fault:false, gun1:0, gun2:0}
];

function login() {
    const userVal = document.getElementById("user").value.toLowerCase();
    role = userVal === "admin" ? "admin" : "operator";
    document.getElementById("roleDisplay").innerText = "ROLE: " + role.toUpperCase();
    document.getElementById("login").style.display = "none";
    document.getElementById("dash").style.display = "block";
    init();
}

function init() {
    // 1. Map Initialization
    map = L.map('map');
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);

    let markers = [];
    chargers.forEach(c => {
        let marker = L.marker([c.lat, c.lng]).addTo(map)
            .bindTooltip(c.id) // Adds a hover label so you can distinguish close markers
            .on('click', () => {
                selected = c;
                document.getElementById("cpanel").style.display = "block";
                document.getElementById("cname").innerText = c.id;
                
                const isAdm = (role === 'admin');
                document.getElementById("restartBtn").disabled = !isAdm;
                document.getElementById("firmwareBtn").disabled = !isAdm;
            });
        markers.push(marker);
    });

    // 2. AUTO-FIT: This ensures all 5 markers are visible immediately
    let group = new L.featureGroup(markers);
    map.fitBounds(group.getBounds().pad(0.2)); 

    // 3. Chart Initialization
    const ctx = document.getElementById('chart').getContext('2d');
    chart = new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: ['Online', 'Busy', 'Offline', 'Fault'],
            datasets: [{
                data: [0, 0, 0, 0],
                backgroundColor: ['#4caf50', '#ff9800', '#f44336', '#9c27b0'],
                borderWidth: 0
            }]
        },
        options: { 
            responsive: true, 
            maintainAspectRatio: false,
            plugins: {
                legend: { position: 'bottom', labels: { boxWidth: 12, padding: 20 } }
            }
        }
    });

    // Handle map resizing issues
    setTimeout(() => map.invalidateSize(), 500);
}

function runCommand(cmd) {
    document.getElementById("modalMsg").innerText = cmd + " successful for " + selected.id;
    document.getElementById("customModal").style.display = "flex";
}

function closeModal() { document.getElementById("customModal").style.display = "none"; }
function closePanel() { document.getElementById("cpanel").style.display = "none"; }

function toggleTheme() {
    theme = (theme === "light") ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", theme);
}

// REAL-TIME UPDATES (Every 2 seconds)
setInterval(() => {
    chargers.forEach(c => {
        let rand = Math.random();
        if (rand > 0.95) {
            c.fault = true;
        } else {
            c.fault = false;
            if (rand > 0.7) c.status = "busy";
            else if (rand > 0.2) c.status = "online";
            else c.status = "offline";
        }

        if (c.status === "busy" && !c.fault) {
            c.gun1 = (Math.random() * 60).toFixed(1);
            c.gun2 = (Math.random() * 60).toFixed(1);
        } else {
            c.gun1 = "0.0";
            c.gun2 = "0.0";
        }
    });

    let n_on = chargers.filter(c => c.status === 'online' && !c.fault).length;
    let n_bsy = chargers.filter(c => c.status === 'busy' && !c.fault).length;
    let n_off = chargers.filter(c => c.status === 'offline' && !c.fault).length;
    let n_flt = chargers.filter(c => c.fault).length;

    document.getElementById("total").innerText = chargers.length;
    document.getElementById("online").innerText = n_on;
    document.getElementById("busy").innerText = n_bsy;
    document.getElementById("offline").innerText = n_off;
    document.getElementById("fault").innerText = n_flt;

    if(selected) {
        document.getElementById("cstatus").innerText = selected.fault ? "FAULT" : selected.status.toUpperCase();
        document.getElementById("g1").innerText = selected.gun1;
        document.getElementById("g2").innerText = selected.gun2;
    }

    chart.data.datasets[0].data = [n_on, n_bsy, n_off, n_flt];
    chart.update();

}, 2000);
</script>
</body>
</html>
